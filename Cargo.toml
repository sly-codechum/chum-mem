[workspace]
members = [
  "rust/crates/chum_mem_app",
  "rust/crates/chum_mem_config",
  "rust/crates/chum_mem_contracts",
  "rust/crates/chum_mem_db",
  "rust/crates/chum_mem_pipeline",
  "rust/apps/api",
  "rust/apps/worker",
]
resolver = "2"

[workspace.package]
edition = "2024"
license = "MIT"
rust-version = "1.85"
version = "0.1.0"

[workspace.dependencies]
anyhow = "1.0.100"
futures = "0.3"
axum = { version = "0.8.6", features = ["json", "macros"] }
indexmap = { version = "2.9.0", features = ["serde"] }
http = "1.3.1"
reqwest = { version = "0.12.24", default-features = false, features = ["json", "rustls-tls"] }
base64 = "0.22"
regex = "1.12.2"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
sha2 = "0.10.9"
sqlx = { version = "0.8.6", default-features = false, features = ["json", "macros", "postgres", "runtime-tokio-rustls", "time", "uuid"] }
thiserror = "2.0.17"
time = { version = "0.3.44", features = ["formatting", "macros", "parsing", "serde"] }
tokio = { version = "1.48.0", features = ["macros", "net", "rt-multi-thread", "signal", "time"] }
tower = { version = "0.5.2", features = ["util"] }
tower-http = { version = "0.6.6", features = ["cors", "trace"] }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.20", features = ["env-filter", "fmt", "json"] }
turbovec = "0.8.0"
url = { version = "2.5.7", features = ["serde"] }
uuid = { version = "1.18.1", features = ["serde", "v4"] }
zip = { version = "2.4.2", default-features = false, features = ["deflate"] }

# Tree-sitter core + language grammars
streaming-iterator = "0.1"
tree-sitter = "0.24"
tree-sitter-python = "0.23"
tree-sitter-typescript = "0.23"
tree-sitter-javascript = "0.23"
tree-sitter-go = "0.23"
tree-sitter-rust = "0.23"
tree-sitter-java = "0.23"
tree-sitter-c = "0.23"
tree-sitter-cpp = "0.23"
tree-sitter-ruby = "0.23"
tree-sitter-c-sharp = "0.23"
tree-sitter-scala = "0.23"
tree-sitter-php = "0.23"
tree-sitter-lua = "0.2"
tree-sitter-zig = "1.1"
tree-sitter-elixir = "0.3"
tree-sitter-julia = "0.23"
